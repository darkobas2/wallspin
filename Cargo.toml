[package]
name = "wallspin"
description = "Wallpaper changer for GNOME: topics, per-monitor images, clock overlay"
license = "MIT"
repository = "https://github.com/darkobas2/wallspin"
keywords = ["wallpaper", "gnome", "desktop", "background"]
categories = ["command-line-utilities", "gui"]
version = "0.1.2"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fast_image_resize = "6.1.0"
futures-util = "0.3.34"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imagesize = "0.15.0"
jpeg-decoder = "0.3.2"
ksni = "0.3.7"
libc = "0.2.191"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync", "process"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = { version = "6", default-features = false, features = ["proxy", "service", "tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
